appId: com.dsh.desktop-container
productName: Desktop Container
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!_legacy/**'
  - '!test/**'
  - '!pages/**'
  - '!scripts/**'
  - '!tools/**'
  # Bundled runtimes (node/openclaw/dsh/codex) ship via extraResources only. Packing
  # resources/** into app.asar as well would duplicate ~500 MB in the installer.
  - '!resources/**'
asarUnpack:
  - '**/node_modules/node-pty/**'
extraResources:
  # Ship the whole bundled-runtime tree in ONE matcher.
  #
  # Do NOT use per-directory entries (from: resources/dsh, to: dsh): electron-builder's
  # filter drops the *root* node_modules of every copy source
  # (createFilter() in app-builder-lib/out/util/filter.js: `if (relative === "node_modules") return false`),
  # so such an entry silently ships the npm prefix WITHOUT its node_modules — only the
  # shims/.npmrc land in the installer. Copying `resources/` as a whole moves that
  # directory to `dsh/node_modules`, which is kept.
  - from: resources
    to: .
    filter: ['**/*']
  # builtin page metas (codex / dsh-web / openclaw / dsh-plugin-market) — seeded into
  # userData/pages on first launch so they survive packaged updates.
  - from: pages
    to: pages
    filter: ['**/*']
win:
  executableName: dsh-desktop-container
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: dsh
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
