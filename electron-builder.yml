appId: com.dsh.desktop-container
productName: Desktop Container
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!_legacy/**'
  - '!test/**'
  - '!pages/**'
  - '!scripts/**'
  - '!tools/**'
  # Bundled runtimes (node/openclaw/dsh) ship via extraResources only — packing
  # them into app.asar as well would duplicate the installer. Everything else
  # under resources/ stays: icon.png is required at runtime (taskbar + tray) and is read
  # from inside the asar by the `?asset` import, so excluding all of resources/** made the
  # packaged app come up with an empty icon.
  - '!resources/node/**'
  - '!resources/openclaw/**'
  - '!resources/dsh/**'
  - '!resources/icon-src.png'
asarUnpack:
  - '**/node_modules/node-pty/**'
extraResources:
  # boot.cjs — the external entry point that redirects app.asar to updated versions.
  # Lives outside app.asar so electron-builder never tries to resolve it inside the archive.
  - from: src/boot.cjs
    to: boot.cjs
  # Ship the whole bundled-runtime tree in ONE matcher.
  #
  # Do NOT use per-directory entries (from: resources/dsh, to: dsh): electron-builder's
  # filter drops the *root* node_modules of every copy source
  # (createFilter() in app-builder-lib/out/util/filter.js: `if (relative === "node_modules") return false`),
  # so such an entry silently ships the npm prefix WITHOUT its node_modules — only the
  # shims/.npmrc land in the installer. Copying `resources/` as a whole moves that
  # directory to `dsh/node_modules`, which is kept.
  - from: resources
    to: .
    filter: ['**/*']
  # builtin page metas (dsh-web; openclaw is seeded by ensureDefaultOpenclawPage at
  # runtime) — seeded into userData/pages on first launch so they survive packaged updates.
  - from: pages
    to: pages
    filter: ['**/*']
win:
  executableName: dsh-desktop-container
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: dsh
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
