appId: com.desktop-container
productName: 桌面控制台
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!_legacy/**'
  - '!test/**'
  - '!pages/**'
  - '!scripts/**'
  - '!tools/**'
  # Publish/scratch artifacts — dist-release holds the LAST app.zip (~130 MB); electron-builder
  # does NOT honour .gitignore, so without this it gets packed into app.asar and the release
  # push then dies on GitHub's 100 MB per-file limit.
  - '!dist-release/**'
  - '!.qoder/**'
  - '!.workbuddy/**'
  - '!{tsconfig.node,tsconfig.web}.tsbuildinfo'
  - '!vitest{.config,.ui.config}.ts'
  - '!build_log_ascii.txt'
  # Bundled runtimes (node/openclaw/dsh) ship via extraResources only — packing
  # them into app.asar as well would duplicate the installer. Everything else
  # under resources/ stays: icon.png is required at runtime (taskbar + tray) and is read
  # from inside the asar by the `?asset` import, so excluding all of resources/** made the
  # packaged app come up with an empty icon.
  - '!resources/node/**'
  - '!resources/openclaw/**'
  - '!resources/dsh/**'
  - '!resources/icon-src.png'
asarUnpack:
  - '**/node_modules/node-pty/**'
extraResources:
  # boot.cjs — the external entry point that redirects app.asar to updated versions.
  # Lives outside app.asar so electron-builder never tries to resolve it inside the archive.
  - from: src/boot.cjs
    to: boot.cjs
  # Bundled runtimes (node/dsh/openclaw) are NO LONGER shipped in the installer — they are
  # provisioned on demand at runtime into userData (node→userData/node, dsh→userData/dsh,
  # openclaw→userData/openclaw) and driven by the first-run SetupGate (download/guide). This
  # keeps the installer small; only icon.png still ships here (required at runtime for the
  # taskbar/tray; appIconPath() probes this unpacked copy as a fallback to the asar `?asset`).
  - from: resources
    to: .
    filter: ['icon.png']
  # builtin page metas (dsh-web; openclaw is seeded by ensureDefaultOpenclawPage at
  # runtime) — seeded into userData/pages on first launch so they survive packaged updates.
  - from: pages
    to: pages
    filter: ['**/*']
win:
  executableName: DesktopContainer
nsis:
  # fixed product-name artifact (was ${name}-… = DesktopContainer-…); matches executableName/appId
  artifactName: DesktopContainer-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: dsh
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
