name: CI

# Quality gate only: lint + typecheck + unit/ui tests.
# Packaging and publishing stay local (npm run build:win + npm run publish:update).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The gate never boots Electron, so skip its binary download and every
      # install script (native rebuilds) — vitest runs on plain node/jsdom.
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: UI tests
        run: npm run test:ui
